# Frigate camera configuration for the Pepper robot.
# Merge these blocks into your main Frigate config.yml (e.g. /config/config.yml).
# Address the robot by a STABLE DNS NAME, not an IP: Pepper's WiFi IP is DHCP and
# changes. Here we use pepper.<domaine-lan> — replace it with your robot's name.
# (The ONVIF bridge echoes the Host header, so PTZ follows the name automatically.)
#
# IMPORTANT: the streams are MJPEG. An NVIDIA GPU (e.g. P2000) cannot hardware
# decode MJPEG (NVDEC has no JPEG decoder), so override hwaccel_args to [] on
# these cameras to force lightweight CPU decoding. Leave your other H264/H265
# cameras on nvidia hwaccel as usual.

cameras:
  # Head camera (forehead) — bridged from NAOqi, ONVIF PTZ controllable
  pepper_head:
    enabled: true
    ffmpeg:
      hwaccel_args: []                 # MJPEG -> CPU decode, never the GPU NVDEC
      inputs:
        - path: rtsp://pepper.<domaine-lan>:8554/head
          input_args: preset-rtsp-generic
          roles: [ detect, record ]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    record:
      enabled: true
      retain:
        days: 3
        mode: motion
    onvif:
      host: pepper.<domaine-lan>
      port: 8000
      user: "admin"                    # credentials are ignored by the bridge
      password: "admin"
      # autotracking:                  # optional, experimental
      #   enabled: true
      #   track: [ person ]
      #   zooming: disabled

  # Bottom camera (mouth) — direct V4L2 capture, no PTZ
  pepper_bottom:
    enabled: true
    ffmpeg:
      hwaccel_args: []
      inputs:
        - path: rtsp://pepper.<domaine-lan>:8554/bottom
          input_args: preset-rtsp-generic
          roles: [ detect, record ]
    detect:
      enabled: true
      width: 640
      height: 480
      fps: 5
    record:
      enabled: true
      retain:
        days: 3
        mode: motion

# Optional: smooth low-latency live view (WebRTC/MSE) via Frigate's built-in go2rtc
go2rtc:
  streams:
    pepper_head:
      - rtsp://pepper.<domaine-lan>:8554/head
    pepper_bottom:
      - rtsp://pepper.<domaine-lan>:8554/bottom
